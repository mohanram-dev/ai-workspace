name: Bug report
description: Something does not work the way the README says it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems must **not** be reported here — use *Security → Report a vulnerability* (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a task with the DevOps agent: "…"
        2. Approve the docker.stop request
        3. The task shows …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "git rev-parse --short HEAD"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How it is running
      options:
        - pnpm dev / pnpm start (single process)
        - docker-compose.prod.yml / Coolify (web + worker)
        - other (say in the description)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or timeline events
      description: From the task's Logs tab, the server console, or `docker compose logs`. **Remove anything secret** — API keys, tokens, file contents you would not share.
      render: text
